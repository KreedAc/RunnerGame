<!doctype html>
<meta charset="utf-8">
<!-- Senza questo un browser mobile impagina a 980 px virtuali e poi
     rimpicciolisce tutto per farlo entrare nello schermo: su un telefono
     da 412 px l'interfaccia usciva 2,4 volte più piccola del dovuto, e la
     scena 3D con lei. L'artifact non lo mostrava perché il suo
     contenitore aggiunge un <head> proprio, viewport compreso. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1a2b">
<meta name="color-scheme" content="dark">
<title>Torre di Ghiaccio</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#0d1a2b;
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .hidden{display:none !important}

  /* ============================== HUD ============================== */
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pill{background:rgba(16,32,52,.66);backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,.24);border-radius:14px;
    padding:6px 13px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.3px;
    text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap}
  .pill small{display:block;font-size:10px;opacity:.6;letter-spacing:1.2px;font-weight:800}
  .pill b{font-size:19px;font-variant-numeric:tabular-nums}

  /* la potenza è il numero che conta: sta al centro e domina */
  #powerPill{background:linear-gradient(180deg,#6fe0ff,#1f8fd6);
    border-color:rgba(255,255,255,.6);padding:5px 22px;text-align:center}
  #powerPill b{font-size:31px;line-height:1.05}
  #powerPill small{opacity:.9}

  .row.mid{justify-content:center;gap:8px;margin-top:7px}
  #wallPill{background:rgba(60,40,86,.7);border-color:rgba(200,170,255,.4)}
  #wallPill b{color:#e2ccff}

  #progressWrap{margin:11px 2px 0;height:8px;border-radius:99px;
    background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.28);overflow:hidden}
  #progress{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#8ff0ff,#ffd24b);transition:width .12s linear}

  /* colonnina dei bonus raccolti */
  #buffRail{position:absolute;left:12px;top:158px;display:flex;flex-direction:column;gap:6px}
  .buff{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:11px;
    background:rgba(16,32,52,.68);border:2px solid;color:#fff;
    font-size:11px;font-weight:800;letter-spacing:.2px}
  .buff-icon{font-size:13px}
  .buff-name{opacity:.7}
  .buff b{font-size:13px}

  #pops{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .pop{position:absolute;top:48%;transform:translate(-50%,0);
    font-size:38px;font-weight:900;color:#fff;-webkit-text-stroke:3px rgba(24,20,38,.55);
    animation:popUp .85s ease-out forwards}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
    25%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-120px) scale(1)}
  }

  /* striscione dei momenti che contano */
  /* Il cartello dei momenti che contano.

     Prima era testo nudo sulla scena con -webkit-text-stroke: 3px. Quel
     contorno è centrato sul bordo della lettera, quindi metà se la mangia
     da dentro — su un carattere nero a 40px le aste si assottigliano e i
     tondi si chiudono, e il risultato sembra sfocato. In più l'oro su un
     cielo azzurro chiaro non ha abbastanza contrasto per reggere da solo.

     Adesso è una targa: pannello scuro dietro, niente contorno, e l'ombra
     piena sotto le lettere invece che attorno. Il colore dice com'è andata
     — oro per i momenti belli, rosso per quelli brutti. */
  #banner{position:fixed;left:0;right:0;top:27%;z-index:8;
    display:flex;justify-content:center;
    pointer-events:none;padding:0 16px;opacity:0}
  #banner b{display:block;max-width:min(90vw,430px);padding:13px 22px 15px;
    border-radius:20px;background:rgba(11,19,33,.85);
    border:2px solid rgba(255,255,255,.15);
    box-shadow:0 14px 36px rgba(0,0,0,.5);
    font-size:clamp(20px,5.8vw,31px);font-weight:900;line-height:1.1;
    letter-spacing:.4px;text-align:center;text-wrap:balance;
    color:#ffd24b;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  #banner.bad b{color:#ff9d8a;border-color:rgba(255,157,138,.28)}
  /* I momenti belli restano oro, che è il colore del gioco: il verde
     acceso su fondo scuro sembrava una notifica di sistema. */
  #banner.good b{border-color:rgba(255,210,75,.35)}
  #banner.show{animation:bannerIn 1.9s ease-out forwards}
  @keyframes bannerIn{
    0%{opacity:0;transform:scale(.6)}
    10%{opacity:1;transform:scale(1.14)}
    20%{transform:scale(1)}
    82%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.06)}
  }

  /* ============================== MENÙ ============================== */
  #hub{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px
      calc(env(safe-area-inset-bottom,0px) + 14px);
    color:#fff;overflow-y:auto;
    background:linear-gradient(180deg,rgba(10,26,44,.12),rgba(10,26,44,.4) 42%,rgba(10,26,44,.92))}

  .hub-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .wallet{display:flex;gap:8px}
  .coin-pill{display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:13px;
    background:rgba(16,32,52,.68);border:2px solid rgba(255,255,255,.24);
    font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}

  /* Tutte le misure del menù sono strette apposta: con otto zone, le
     bandierine, gli aspetti e il diario, la home aveva superato l'altezza
     di un telefono e il diario — che è fatto per essere fotografato —
     finiva sotto la piega. Vedi DESIGN, "La home in uno schermo". */
  .hub-title{margin-top:10px;text-align:center}
  .hub-title .name{font-size:clamp(30px,9vw,50px);font-weight:900;line-height:.92;
    background:linear-gradient(180deg,#fff,#9fe6ff 55%,#ffd24b);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(24,20,38,.55))}
  .hub-title .zone{margin-top:5px;font-size:13.5px;font-weight:800;letter-spacing:2px;opacity:.8}
  .hub-title .best{margin-top:3px;font-size:12px;font-weight:800;letter-spacing:1.4px;
    color:#ffd24b;opacity:.92}

  .story{margin:12px auto 0;max-width:31ch;font-size:13px;font-weight:700;
    line-height:1.45;text-align:center;opacity:.92;text-wrap:balance}
  .story b{color:#ffd24b}

  /* riepilogo dell'ultima corsa */
  .last-run{position:relative;margin:12px auto 0;max-width:310px;padding:11px 18px 9px;
    border-radius:20px;background:rgba(16,32,52,.66);
    border:2px solid rgba(255,255,255,.24)}
  .lr-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    padding:3px 14px;border-radius:99px;white-space:nowrap;
    background:linear-gradient(180deg,#ffd056,#f0a01a);color:#3a2000;
    font-size:11px;font-weight:900;letter-spacing:1.2px}
  .lr-out{font-size:12px;font-weight:900;letter-spacing:1.4px;text-align:center;
    margin-bottom:9px;opacity:.9}
  .lr-row{display:flex;align-items:center;justify-content:space-around;gap:10px}
  .lr-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
  .lr-cell b{font-size:26px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .lr-cell b.gold{color:#ffd24b}
  .lr-cell span{font-size:10px;font-weight:800;letter-spacing:1.4px;opacity:.6}
  .lr-sep{width:2px;align-self:stretch;background:rgba(255,255,255,.18);border-radius:2px}

  .hint{display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:13px;font-weight:700;opacity:.75;margin-top:12px}
  /* Era una pillina con il pallino che scorre: identica a un interruttore
     acceso/spento, e infatti la prima cosa che viene da fare è premerla.
     Adesso è un dito fra due frecce — si legge "trascina", non "attiva". */
  .swipe{display:inline-flex;align-items:center;gap:3px;
    font-size:14px;color:rgba(255,255,255,.45)}
  .swipe .dito{font-size:19px;line-height:1;
    animation:sw 1.6s ease-in-out infinite}
  @keyframes sw{0%,100%{transform:translateX(-9px)}50%{transform:translateX(9px)}}

  .spacer{flex:1;min-height:6px}

  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:20px;
    padding:14px 50px;font-size:21px;font-weight:900;color:#3a2000;font-family:inherit;
    background:linear-gradient(180deg,#ffd970,#f5a91d);
    box-shadow:0 7px 0 #b96e00,0 12px 26px rgba(0,0,0,.45);
    transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b96e00,0 6px 14px rgba(0,0,0,.4)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .play-wrap{display:flex;justify-content:center;margin-bottom:11px}

  /* la carta della rinascita: sta fra il risultato e i potenziamenti,
     perché è la scelta che si fa quando i potenziamenti non bastano più */
  .rebirth-card{display:block;width:100%;max-width:340px;margin:0 auto 8px;
    padding:8px 16px 7px;border-radius:20px;cursor:pointer;font-family:inherit;
    color:#fff;text-align:center;border:2px solid rgba(190,150,255,.5);
    background:linear-gradient(180deg,#5b3f8f,#38265c);
    box-shadow:0 5px 0 rgba(20,10,40,.65);
    transition:transform .08s,box-shadow .08s,filter .2s}
  .rebirth-card:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,10,40,.65)}
  .rebirth-card:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .rebirth-card.ready{animation:rbPulse 1.8s ease-in-out infinite}
  .rebirth-card.armed{border-color:#ffd970;
    background:linear-gradient(180deg,#8a5fbf,#5b3f8f);animation:none}
  @keyframes rbPulse{
    0%,100%{box-shadow:0 5px 0 rgba(20,10,40,.65),0 0 0 0 rgba(190,150,255,.5)}
    50%{box-shadow:0 5px 0 rgba(20,10,40,.65),0 0 0 10px rgba(190,150,255,0)}
  }
  .rb-head{font-size:11px;font-weight:900;letter-spacing:1.5px;opacity:.85}
  .rb-row{display:flex;align-items:baseline;justify-content:center;gap:6px;
    flex-wrap:wrap;margin-top:4px}
  .rb-gain{font-size:20px;font-weight:900;color:#e2c4ff;font-variant-numeric:tabular-nums}
  .rb-bonus{font-size:18px;font-weight:900;color:#ffd970;font-variant-numeric:tabular-nums}
  .rb-lbl{font-size:10px;font-weight:800;letter-spacing:1.2px;opacity:.62}
  .rb-sep{width:2px;height:16px;background:rgba(255,255,255,.22);border-radius:2px;
    align-self:center;margin:0 4px}
  .rb-note{margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.9px;opacity:.72}
  .rebirth-card.armed .rb-note{opacity:1;color:#ffd970}

  /* Le tre carte di potenziamento. Sono il cuore del gioco — è lì che si
     spende l'oro — e invece erano l'elemento più piccolo dello schermo:
     un pollice ci arrivava, un occhio no. */
  #upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .up-card{display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 6px 9px;border-radius:20px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#3f5a7a,#26374d);
    border:2px solid rgba(255,255,255,.3);
    box-shadow:0 5px 0 rgba(9,18,30,.6);color:#fff;
    transition:transform .08s,box-shadow .08s,filter .12s}
  .up-card:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(9,18,30,.6)}
  /* Non comprabile: si spegne, ma il costo resta acceso — è il numero che
     dice quanto manca, spegnerlo nasconde proprio l'informazione utile. */
  .up-card.locked{filter:grayscale(.55) brightness(.72);cursor:default}
  .up-card.locked .up-cost{filter:saturate(1.6) brightness(1.25)}
  .up-card:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .up-name{font-size:13px;font-weight:900;letter-spacing:1px}
  .up-level{font-size:10.5px;opacity:.55;font-weight:800;letter-spacing:.4px}
  .up-value{margin-top:2px;font-size:21px;line-height:1.1;font-weight:900;color:#8fe3ff;
    font-variant-numeric:tabular-nums}
  /* il nome dell'arma è una parola, non un numero: "Lama Rúna" a 23px
     andrebbe a capo dentro una carta larga un terzo di schermo */
  .up-card[data-key="weapon"] .up-value{font-size:17px}
  .up-cost{margin-top:5px;padding:4px 14px;border-radius:99px;font-size:14.5px;font-weight:900;
    background:linear-gradient(180deg,#ffd970,#f5a91d);color:#3a2000;
    box-shadow:0 3px 0 rgba(150,90,0,.55);
    font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ricomincia da capo: sta in fondo, lontano dal pollice che gioca, e
     chiede due tocchi — cancella tutto e non si torna indietro */
  .reset-btn{display:block;margin:0;padding:7px 15px;border-radius:99px;
    cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;
    letter-spacing:1.2px;color:rgba(255,255,255,.55);
    background:transparent;border:2px solid rgba(255,255,255,.16);
    transition:color .15s,border-color .15s,background .15s}
  .reset-btn:active{transform:translateY(2px)}
  .reset-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .reset-btn.armed{color:#ffb4a2;border-color:rgba(255,120,90,.75);
    background:rgba(120,30,20,.45)}

  /* ========================= SECONDA OCCASIONE =======================
     Compare nel momento in cui la corsa finirebbe: il muro ti ha fermato
     a due blocchi dalla torre, o il carceriere ti ha piegato. È lì che i
     diamanti hanno un senso, e il tempo che scorre fa parte della scelta. */
  .revive{position:fixed;inset:0;z-index:5;display:flex;align-items:center;
    justify-content:center;padding:20px;background:rgba(8,16,28,.72)}
  .rv-card{width:100%;max-width:330px;padding:20px 18px 14px;border-radius:24px;
    text-align:center;color:#fff;border:2px solid rgba(120,230,255,.45);
    background:linear-gradient(180deg,#1d4668,#122a44);
    box-shadow:0 10px 0 rgba(6,14,24,.7),0 18px 40px rgba(0,0,0,.5)}
  .rv-head{font-size:19px;font-weight:900;letter-spacing:1.4px;color:#8fe3ff}
  .rv-why{margin-top:5px;font-size:11.5px;font-weight:800;letter-spacing:1.1px;opacity:.7}
  .rv-go{display:flex;flex-direction:column;align-items:center;gap:2px;
    width:100%;margin-top:15px;padding:13px 10px;border:none;border-radius:20px;
    cursor:pointer;font-family:inherit;color:#0d2a12;
    background:linear-gradient(180deg,#8ef2a0,#2fbd63);
    box-shadow:0 6px 0 #1c7a3f;transition:transform .08s,box-shadow .08s}
  .rv-go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c7a3f}
  .rv-go .rv-what{font-size:18px;font-weight:900;letter-spacing:.6px}
  .rv-go .rv-gain{font-size:12px;font-weight:800;opacity:.75}
  .rv-cost{display:inline-block;margin-bottom:3px;padding:3px 13px;border-radius:99px;
    background:rgba(10,40,20,.35);font-size:14px;font-weight:900}
  /* la barra che si svuota: dice che la scelta ha una fine */
  .rv-bar{height:6px;margin:12px 4px 0;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.15)}
  .rv-bar i{display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#8fe3ff,#ffd24b)}
  .rv-no{margin-top:9px;padding:7px 16px;border-radius:99px;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:800;letter-spacing:1.1px;
    color:rgba(255,255,255,.55);background:transparent;
    border:2px solid rgba(255,255,255,.16)}
  .rv-left{margin-top:8px;font-size:10.5px;font-weight:800;letter-spacing:1px;opacity:.45}

  /* Il diario della salita: quanti tentativi è costata ogni torre.
     È fatto per essere fotografato — una riga sola, numeri grandi
     abbastanza da leggersi in uno screenshot. */
  .diary{margin-top:9px}
  .dy-lbl{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:1.4px;
    color:rgba(255,255,255,.35)}
  .dy-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:4px}
  .dy-chip{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;
    background:rgba(16,32,52,.62);border:2px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  .dy-chip b{color:#8fe3ff;font-size:12.5px}
  /* la torre in corso: quella che stai ancora provando */
  .dy-chip.now{border-color:rgba(255,210,75,.55);background:rgba(60,45,16,.5)}
  .dy-chip.now b{color:#ffd24b}
  /* l'asterisco dice che lì hai usato la seconda occasione */
  .dy-chip i{font-style:normal;color:#7ce0a0}

  /* L'aspetto: una fila di pastiglie colorate sotto ai potenziamenti.
     Colori e non nomi — cinque nomi in fila su un telefono non si leggono,
     cinque macchie di colore sì — e il nome di quello toccato nella riga
     sotto, una alla volta. */
  .skins{margin-top:10px}
  .sk-row{display:flex;justify-content:center;gap:9px}
  .sk{width:34px;height:34px;border-radius:50%;cursor:pointer;padding:0;
    position:relative;font-family:inherit;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.28);
    transition:transform .1s,border-color .15s}
  .sk.on{border-color:#ffd24b;transform:scale(1.14);
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.28),0 0 0 3px rgba(255,210,75,.22)}
  .sk.locked{filter:saturate(.35) brightness(.62)}
  .sk.locked.armed{filter:none;border-color:#8fe3ff}
  .sk i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:14px}
  .sk-name{margin-top:5px;text-align:center;font-size:10.5px;font-weight:800;
    letter-spacing:1.2px;color:rgba(255,255,255,.5)}
  .sk-name.armed{color:#8fe3ff}

  /* le due bandierine: stanno in fondo, fuori dalla strada del pollice
     che gioca, ma sempre visibili — una lingua che non si trova è come
     non averla */
  .fondo{display:flex;align-items:center;justify-content:center;gap:10px;
    flex-wrap:wrap;margin-top:11px}
  .langs{display:flex;gap:7px}
  .lang-btn{padding:6px 14px;border-radius:99px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:800;letter-spacing:.8px;
    color:rgba(255,255,255,.45);background:transparent;
    border:2px solid rgba(255,255,255,.14);transition:color .15s,border-color .15s}
  .lang-btn.on{color:#8fe3ff;border-color:rgba(143,227,255,.5);
    background:rgba(22,60,84,.5)}

  /* la marca della build: serve a sapere, guardando il telefono, se la
     pagina che hai davanti è quella appena pubblicata o una in cache */
  .build-tag{margin-top:5px;text-align:center;font-size:9.5px;font-weight:700;
    letter-spacing:1.1px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){
    .swipe .dito,.pop{animation:none}
    #banner.show{animation:none;opacity:1}
  }
</style>

<div id="stage"></div>

<!-- ============================== HUD ============================== -->
<div id="hud" class="hidden">
  <div class="row">
    <div class="pill"><small data-t="hud.weapon">ARMA</small><b id="hWeapon">Pugni</b></div>
    <div class="pill" id="powerPill"><small data-t="hud.power">POTENZA</small><b id="hPower">20</b></div>
    <div class="pill"><small data-t="hud.gold">ORO</small><b id="hCoins">0</b></div>
  </div>
  <div class="row mid">
    <div class="pill"><small data-t="hud.hit">COLPO</small><b id="hDamage">3</b></div>
    <div class="pill" id="wallPill"><small data-t="hud.wall">MURO</small><b id="hWall">0/30</b></div>
  </div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="buffRail"></div>
</div>
<div id="pops"></div>
<div id="banner"><b></b></div>

<!-- seconda occasione: appare al posto della sconfitta, se hai i diamanti -->
<div class="revive hidden" id="revive">
  <div class="rv-card">
    <div class="rv-head" id="rvHead">TI MANCAVA POCO</div>
    <div class="rv-why" id="rvWhy"></div>
    <button class="rv-go" id="rvGo">
      <span class="rv-cost" id="rvCost">💎 5</span>
      <span class="rv-what" data-t="rv.what">SECONDA OCCASIONE</span>
      <span class="rv-gain" id="rvGain"></span>

     e sta prima di three.js perché finisca anche nel file singolo. -->
<script>window.BUILD = '260912-2131';</script>
<script src="vendor/three.min.js"></script>
<script>
/* three.js: copia locale (offline / Android) con fallback su CDN */
(function () {
  /* I sorgenti si chiedono con la marca della build in coda: GitHub Pages
     li tiene in cache dieci minuti, e senza questo un telefono può
     ritrovarsi con metà file nuovi e metà vecchi — che è peggio che
     averli tutti vecchi. Cambiando l'indirizzo, la cache non c'entra più. */
  const FILES = ['src/i18n.js', 'src/core.js', 'src/art.js', 'src/world.js',
                 'src/actors.js', 'src/hub.js', 'src/game.js']
                .map(f => f + '?v=' + window.BUILD);
  function load(src, cb) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () {
      document.body.insertAdjacentHTML('beforeend',
        '<div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;' +
        'font:700 15px system-ui;background:#0d1a2b">Impossibile caricare ' + src + '</div>');
    };
    document.head.appendChild(s);
  }
  function chain(list, i) {
    if (i >= list.length) return;
    load(list[i], function () { chain(list, i + 1); });
  }
  const boot = function () { chain(FILES, 0); };
  if (window.THREE) boot();
  else load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', boot);
})();
</script>
