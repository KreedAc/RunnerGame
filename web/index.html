<title>Blocky Squad Run</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#0b1220;
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------------------------- HUD ---------------------------- */
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 18px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pill{background:rgba(10,18,34,.58);backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,.22);border-radius:12px;
    padding:6px 14px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.4px;
    text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
  #count{font-size:29px;padding:5px 20px;border-radius:14px;
    background:linear-gradient(180deg,#5fd0ff,#2b8ce0);border-color:rgba(255,255,255,.5)}
  #bossPill{background:rgba(120,26,20,.62);border-color:rgba(255,160,140,.45)}

  /* seconda riga: arma e forza, i due numeri che decidono i combattimenti */
  .row2{display:flex;justify-content:center;gap:8px;margin-top:10px}
  .stat-chip{display:flex;align-items:center;gap:7px;
    background:rgba(10,18,34,.58);backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:5px 13px;
    color:#fff;font-weight:800;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .stat-chip b{font-size:17px;font-variant-numeric:tabular-nums}
  .chip-label{opacity:.62;font-size:11px;letter-spacing:1px}

  #progressWrap{margin:12px 2px 0;height:8px;border-radius:99px;
    background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);overflow:hidden}
  #progress{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#7bf07a,#2fd44a);transition:width .12s linear}

  /* numeri che volano via ad ogni gate / scontro */
  #pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .pop{position:absolute;left:50%;top:52%;transform:translate(-50%,0);
    font-size:42px;font-weight:900;color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.4);
    animation:popUp .85s ease-out forwards}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
    25%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-120px) scale(1)}
  }

  /* -------------------------- SCHERMATE -------------------------- */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;
    background:linear-gradient(180deg,rgba(8,16,32,.05),rgba(8,16,32,.18) 45%,rgba(8,16,32,.8));
    color:#fff}
  .screen.bottom{justify-content:flex-end;gap:12px;padding-bottom:50px}
  .screen.hidden{display:none}
  .title{font-size:clamp(34px,11vw,66px);font-weight:900;line-height:.95;
    background:linear-gradient(180deg,#fff,#ffcf7a);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
  .sub{font-size:16px;font-weight:700;opacity:.9;max-width:24ch;line-height:1.5}
  .rules{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700;
    opacity:.92;max-width:30ch;text-align:left}
  .rules div{display:flex;gap:9px;align-items:flex-start}
  .rules span{flex:none;width:22px;text-align:center}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:18px;
    padding:16px 44px;font-size:21px;font-weight:900;color:#4a2200;
    background:linear-gradient(180deg,#ffd056,#ff9f1a);
    box-shadow:0 7px 0 #c96f00,0 12px 24px rgba(0,0,0,.4);
    transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c96f00,0 6px 14px rgba(0,0,0,.4)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .stat{font-size:18px;font-weight:800;opacity:.95}
  .big{font-size:clamp(40px,14vw,78px);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.3)}
  .hint{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;opacity:.8}
  .swipe{width:60px;height:32px;border:3px solid rgba(255,255,255,.6);border-radius:99px;position:relative}
  .swipe::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;
    border-radius:50%;background:#fff;animation:sw 1.5s ease-in-out infinite}
  @keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
  @media (prefers-reduced-motion:reduce){.swipe::after,.pop{animation:none}}
</style>

<div id="stage"></div>

<div id="hud">
  <div class="row">
    <div class="pill" id="levelPill">LIVELLO 1</div>
    <div class="pill" id="count">4</div>
    <div class="pill" id="bossPill">☠ --</div>
  </div>
  <div class="row2">
    <div class="stat-chip"><span class="chip-label">ARMA</span><b id="weapon">Pugni</b></div>
    <div class="stat-chip"><span class="chip-label">FORZA</span><b id="force">4</b></div>
  </div>
  <div id="progressWrap"><div id="progress"></div></div>
</div>
<div id="pops"></div>

<div class="screen" id="menu">
  <div class="title">BLOCKY<br>SQUAD RUN</div>
  <div class="rules">
    <div><span>🟩</span><div>I gate verdi ingrossano la squadra, i rossi la falciano.</div></div>
    <div><span>🟦</span><div>I gate blu migliorano l'arma: più danno, meno perdite.</div></div>
    <div><span>☠</span><div>I mob costano omini. Con l'arma giusta ne costano pochi.</div></div>
  </div>
  <button class="btn" id="playBtn">GIOCA</button>
  <div class="hint"><span class="swipe"></span> trascina per muoverti</div>
</div>

<div class="screen bottom hidden" id="result">
  <div class="title" id="resTitle">VITTORIA!</div>
  <div class="big" id="resCount">0</div>
  <div class="stat" id="resInfo"></div>
  <button class="btn" id="nextBtn">AVANTI</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
/* three.js: copia locale (offline / Android) con fallback su CDN */
(function () {
  const FILES = ['src/core.js', 'src/blocks.js', 'src/world.js', 'src/actors.js', 'src/game.js'];
  function load(src, cb) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () {
      document.body.insertAdjacentHTML('beforeend',
        '<div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;' +
        'font:700 15px system-ui;background:#0b1220">Impossibile caricare ' + src + '</div>');
    };
    document.head.appendChild(s);
  }
  function chain(list, i) {
    if (i >= list.length) return;
    load(list[i], function () { chain(list, i + 1); });
  }
  const boot = function () { chain(FILES, 0); };
  if (window.THREE) boot();
  else load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', boot);
})();
</script>
